<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src 'none'; connect-src 'none'; font-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<style>/*INLINE:chat.css*/</style>
</head>
<body>
<header id="bar">
  <button id="new-chat" title="Start a new chat">New chat</button>
  <select id="mode" title="Permission mode">
    <option value="default">Ask before edits</option>
    <option value="acceptEdits">Accept edits</option>
    <option value="plan">Plan only</option>
    <option value="auto">Auto</option>
  </select>
  <button id="show-changes" title="Show everything changed in this checkout: since main on a branch, otherwise since this session started">Diff</button>
  <span id="checkout" hidden></span>
  <span id="status"></span>
  <button id="restart" hidden>Restart</button>
</header>
<main id="log"></main>
<div id="activity" hidden><span id="activity-dots" class="dots"><span></span><span></span><span></span></span><span id="activity-label" class="label"></span><span id="activity-secs" class="secs"></span><button id="activity-stop" class="stop" title="Stop Claude">Stop</button></div>
<div id="context" hidden><span id="context-text"></span><button id="context-off" title="Leave the editor context out of the next message">×</button></div>
<div id="attachments" hidden></div>
<footer id="composer">
  <textarea id="input" rows="3" placeholder="Message Claude (Enter to send, Shift+Enter for a new line)"></textarea>
  <button id="attach" title="Attach images">📎</button>
  <button id="send">Send</button>
</footer>
<script>/*INLINE:marked*/</script>
<script>/*INLINE:purify*/</script>
<script>/*INLINE:chat.js*/</script>
</body>
</html>
