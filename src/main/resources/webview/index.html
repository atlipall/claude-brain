<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src 'none'; connect-src 'none'; font-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<style>/*INLINE:chat.css*/</style>
</head>
<body>
<header id="bar">
  <select id="mode" title="Permission mode">
    <option value="default">Ask before edits</option>
    <option value="acceptEdits">Accept edits</option>
    <option value="plan">Plan only</option>
    <option value="auto">Auto</option>
  </select>
  <button id="model" class="chip" title="Change the model and effort" aria-haspopup="dialog" hidden><span id="model-label"></span><span id="effort-label"></span></button>
  <button id="show-changes" class="icon" aria-label="View changes" title="View changes: everything changed in this checkout, since main on a branch, otherwise since this session started"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M3.5 1.5h6l3 3v10h-9zM8 5v4M6 7h4M6 11.5h4"/></svg></button>
  <span id="checkout" hidden></span>
  <span id="status" role="status"></span>
  <span id="usage" hidden tabindex="0" role="meter" aria-valuemin="0" aria-valuemax="100"><span id="usage-ring"></span><span id="usage-pct"></span></span>
  <button id="restart" hidden>Restart</button>
</header>
<dialog id="model-dialog" aria-labelledby="model-dialog-title">
  <h2 id="model-dialog-title">Model</h2>
  <div id="model-options" class="choices" role="group" aria-labelledby="model-dialog-title"></div>
  <section id="effort-section" hidden>
    <h2 id="effort-title">Effort</h2>
    <div id="effort-options" class="segments" role="group" aria-labelledby="effort-title"></div>
  </section>
  <form method="dialog" class="dialog-actions"><button>Done</button></form>
</dialog>
<div id="log-wrap">
  <main id="log"><div id="log-content"></div></main>
  <button id="to-bottom" hidden aria-label="Scroll to the latest" title="Scroll to the latest and keep following">↓</button>
</div>
<div id="queue" hidden></div>
<div id="activity" hidden><span id="activity-dots" class="dots"><span></span><span></span><span></span></span><span id="activity-label" class="label" role="status"></span><span id="activity-secs" class="secs" aria-hidden="true"></span><button id="activity-stop" class="stop" title="Stop Claude">Stop</button></div>
<div id="attachments" hidden></div>
<footer id="composer">
  <textarea id="input" rows="3" placeholder="Message Claude (Enter to send, Shift+Enter for a new line)"></textarea>
  <button id="attach" title="Attach images" aria-label="Attach images"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M13 7.5 8 12.5a3.2 3.2 0 0 1-4.5-4.5l5.6-5.6a2.1 2.1 0 0 1 3 3L6.5 11a1 1 0 0 1-1.5-1.5L10 4.5"/></svg></button>
  <button id="send">Send</button>
</footer>
<script>/*INLINE:marked*/</script>
<script>/*INLINE:purify*/</script>
<script>/*INLINE:chat.js*/</script>
</body>
</html>
